<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ocbox-account-origin" content="__ACCOUNT_ORIGIN__">
  <meta name="ocbox-workspace-origin" content="__WORKSPACE_ORIGIN__">
  <title>oc-box — Web sign-in</title>
  <link rel="stylesheet" href="/account-assets/sign-in.css">
  <script type="module" src="/account-assets/sign-in.mjs"></script>
</head>
<body>
  <main class="login-stage" aria-labelledby="login-title">
    <section class="login-card">
      <p class="eyebrow">oc-box / Web sign-in</p>
      <h1 id="login-title">Sign in to the test workspace</h1>
      <p id="login-help">Synthetic integration only. Never enter real credentials. This page does not open a workspace.</p>
      <form id="login-form" autocomplete="off" data-state="loading">
        <label for="login-user">Web username</label>
        <input type="text" id="login-user" required disabled autocomplete="off" autocapitalize="none"
               spellcheck="false" maxlength="32" aria-describedby="login-help login-status">
        <label for="login-password">Web password</label>
        <input type="password" id="login-password" required disabled autocomplete="off" autocapitalize="none"
               spellcheck="false" maxlength="128" aria-describedby="login-help login-status">
        <p id="login-status" role="status">Preparing local sign-in…</p>
        <button id="login-submit" type="submit" disabled>Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
