name: Candidate CodeQL scan

on:
  workflow_call:
    inputs:
      commit:
        description: Off-ref advisory snapshot; release scans use the workflow event SHA
        required: false
        type: string
        default: ''
      branch:
        description: Retain advisory SARIF for this branch; empty means enforce the release gate without uploading
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Verify the exact scan source
        env:
          CANDIDATE: ${{ inputs.commit || github.sha }}
          BRANCH: ${{ inputs.branch }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          case "$BRANCH" in ''|master|devel) ;; *) exit 1 ;; esac
          if [[ -z "$BRANCH" ]]; then test "$CANDIDATE" = "$GITHUB_SHA"; fi
          # The Actions extractor discovers workflow files at the workspace
          # root. Never run source scripts here; the evaluator is a fresh job.
          if [[ "$LANGUAGE" == actions ]]; then test -d .github/workflows; fi
          printf 'Candidate: `%s`\n' "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          output: ${{ runner.temp }}/oc-box-codeql
          upload: never
          upload-database: false
          category: /language:${{ matrix.language }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ inputs.branch || 'release' }}-${{ inputs.commit || github.sha }}-${{ matrix.language }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oc-box-codeql/${{ matrix.language }}.sarif
          if-no-files-found: error
          retention-days: 2

  evaluate:
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript, python]
    steps:
      # The analyzer treats off-ref source as data. Only the event's checker
      # executes here, and downloaded SARIF stays outside the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codeql-${{ inputs.branch || 'release' }}-${{ inputs.commit || github.sha }}-${{ matrix.language }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oc-box-codeql
      - name: Evaluate findings (blocking only on release candidates)
        env:
          CANDIDATE: ${{ inputs.commit || github.sha }}
          BRANCH: ${{ inputs.branch }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          args=()
          if [[ -z "$BRANCH" ]]; then args+=(--gate); fi
          printf 'Language: `%s`\n' "$LANGUAGE" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/check_security_scan.py codeql \
            "$RUNNER_TEMP/oc-box-codeql/$LANGUAGE.sarif" \
            --commit "$CANDIDATE" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
