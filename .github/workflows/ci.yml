name: Package and source checks

on:
  push:
    branches: [master, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and documentation coverage checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age shellcheck
          bash -n completions/oc-box
          shellcheck --shell=bash completions/oc-box
          python -m venv "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests/bin/python" -m pip install 'cryptography>=44'
          "$RUNNER_TEMP/tests/bin/python" -B -m unittest discover -s tests -v
          python tools/build_docs.py --check
          git diff --check
      - name: Build Python distributions
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install build twine
          "$RUNNER_TEMP/build/bin/python" -m build
          "$RUNNER_TEMP/build/bin/python" -m twine check dist/*
          python tools/check_package.py dist --with-vault
  opencode-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install separate unmodified OpenCode versions in temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-v1" --no-audit --no-fund opencode-ai@1.19.5
          npm install --prefix "$RUNNER_TEMP/opencode-v2" --no-audit --no-fund @opencode/cli@2.2.6
      - name: Offline V1 and V2 native integration
        run: |
          export PATH="$RUNNER_TEMP/opencode-v1/node_modules/.bin:$PATH"
          python3 -B tests/smoke_mainline.py
          python3 -B tests/smoke_v2.py --opencode "$RUNNER_TEMP/opencode-v2/node_modules/.bin/opencode"
