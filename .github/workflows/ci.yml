name: Package and source checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and documentation coverage checks
        run: |
          python -B -m unittest discover -s tests -v
          python tools/build_docs.py --check
          git diff --check
      - name: Build Python distributions
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install build twine
          "$RUNNER_TEMP/build/bin/python" -m build
          "$RUNNER_TEMP/build/bin/python" -m twine check dist/*
          python tools/check_package.py dist
