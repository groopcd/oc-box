name: Build and publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing GitHub release to PyPI after checks (false builds only)
        type: boolean
        default: false
      release_tag:
        description: Existing published release tag (required when publishing)
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish_validated: ${{ steps.artifacts.outputs.publish_validated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Create isolated build tools
        run: |
          apt_root=$(mktemp -d /tmp/oc-box-ci-apt.XXXXXXXX)
          chmod 755 "$apt_root"
          apt_config=$(python3 tools/ci_ubuntu_apt.py --output "$apt_root/config")
          sudo apt-get -c "$apt_config" update
          sudo apt-get -c "$apt_config" install -y --no-install-recommends age
          python -m venv "$RUNNER_TEMP/oc-box-build"
          "$RUNNER_TEMP/oc-box-build/bin/python" -m pip install build twine 'cryptography>=44'
      - name: Validate source and release version
        id: release
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/build_docs.py --check
          python - <<'PY'
          import py_compile
          from oc_box.installation import PROGRAM_FILES, source_file
          for name in PROGRAM_FILES:
              if name.endswith('.py'):
                  py_compile.compile(str(source_file('.', name)), doraise=True)
          PY
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            test -n "$RELEASE_TAG"
            gh api --hostname github.com "repos/groopcd/oc-box/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/oc-box-release.json"
            python tools/check_release.py --publish --tag "$RELEASE_TAG" \
              --release-json "$RUNNER_TEMP/oc-box-release.json" \
              > "$RUNNER_TEMP/oc-box-validated-identity.json"
          else
            python tools/check_release.py > "$RUNNER_TEMP/oc-box-validated-identity.json"
          fi
      - name: Run source regression tests
        run: '"$RUNNER_TEMP/oc-box-build/bin/python" -B -m unittest discover -s tests -v'
      - name: Build wheel and source distribution
        run: |
          "$RUNNER_TEMP/oc-box-build/bin/python" -m build
          "$RUNNER_TEMP/oc-box-build/bin/python" -m twine check dist/*
      - name: Verify isolated package installation and resources
        run: python tools/check_package.py dist --with-vault
      - name: Revalidate clean source and bind exact release artifacts
        id: artifacts
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(dist --identity "$RUNNER_TEMP/oc-box-validated-identity.json")
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            gh api --hostname github.com "repos/groopcd/oc-box/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/oc-box-release-final.json"
            args+=(--release-json "$RUNNER_TEMP/oc-box-release-final.json")
          fi
          python tools/check_release_artifacts.py "${args[@]}"
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            echo 'publish_validated=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/oc_box-*.whl
            dist/oc_box-*.tar.gz
            dist/validated-identity.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (github.event_name == 'release' || inputs.publish) && needs.build.outputs.publish_validated == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/oc-box/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-artifacts
      - name: Verify transferred identity and checksums; select only distributions
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import shutil
          bundle = Path("release-artifacts")
          identity = json.loads((bundle / "validated-identity.json").read_text())
          version = identity["distribution_version"]
          assert isinstance(version, str) and re.fullmatch(r"\d+\.\d+\.\d+(?:\.dev0)?", version)
          assert identity["publish_validated"] is True and identity["dirty"] is False
          packages = {f"oc_box-{version}-py3-none-any.whl", f"oc_box-{version}.tar.gz"}
          expected = packages | {"validated-identity.json"}
          lines = (bundle / "SHA256SUMS").read_text().splitlines()
          assert len(lines) == len(expected)
          observed = set()
          for line in lines:
              digest, name = line.split("  ")
              assert name in expected and name not in observed
              assert re.fullmatch(r"[0-9a-f]{64}", digest)
              assert hashlib.sha256((bundle / name).read_bytes()).hexdigest() == digest
              observed.add(name)
          assert observed == expected
          assert {path.name for path in bundle.iterdir()} == expected | {"SHA256SUMS"}
          destination = Path("dist")
          destination.mkdir()
          for name in sorted(packages):
              shutil.copyfile(bundle / name, destination / name)
          PY
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
