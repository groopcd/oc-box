name: Build and publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing GitHub release to PyPI (false runs release preflight only)
        type: boolean
        default: false
      release_tag:
        description: Existing published release tag (required when publishing)
        type: string
        default: ''
      skip_linkedin:
        description: Skip the LinkedIn preview or announcement for this publication
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'groopcd/oc-box'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: resolve
        name: Pin the release or preflight candidate
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$PUBLISH_REQUESTED" == true ]]; then
            case "$EVENT_REF" in refs/heads/master|refs/heads/devel) ;; *) exit 1 ;; esac
          fi
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          if [[ -n "$RELEASE_TAG" || "$PUBLISH_REQUESTED" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.dev0)?$ ]]
            test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$EVENT_SHA"
            if [[ "$EVENT" == workflow_dispatch ]]; then
              branch=master
              if [[ "$RELEASE_TAG" == *.dev0 ]]; then branch=devel; fi
              test "$EVENT_REF" = "refs/heads/$branch"
            fi
          fi
          printf 'commit=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
          printf 'Candidate: `%s`\n' "$EVENT_SHA" >> "$GITHUB_STEP_SUMMARY"

  source:
    needs: candidate
    uses: ./.github/workflows/ci.yml

  distros:
    needs: candidate
    uses: ./.github/workflows/distros.yml

  codeql:
    needs: candidate
    uses: ./.github/workflows/security-codeql.yml

  build:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      publish_validated: ${{ steps.artifacts.outputs.publish_validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Create isolated build tools
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          apt_root=$(mktemp -d /tmp/oc-box-ci-apt.XXXXXXXX)
          chmod 755 "$apt_root"
          apt_config=$(python3 tools/ci_ubuntu_apt.py --output "$apt_root/config" --mirror azure --force-ipv4)
          sudo apt-get -c "$apt_config" update
          sudo apt-get -c "$apt_config" install -y --no-install-recommends age
          python -m venv "$RUNNER_TEMP/oc-box-build"
          python tools/release_python_deps.py > "$RUNNER_TEMP/release-requirements.txt"
          "$RUNNER_TEMP/oc-box-build/bin/python" -m pip install --only-binary=:all: \
            --upgrade -r "$RUNNER_TEMP/release-requirements.txt"
      - name: Gate the resolved Python release dependencies
        env:
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
        run: |
          bash tools/audit_release_python.sh "$RUNNER_TEMP/oc-box-build" "$CANDIDATE" --gate \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate source and release version
        id: release
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/build_docs.py --check
          python - <<'PY'
          import py_compile
          from oc_box.installation import PROGRAM_FILES, source_file
          for name in PROGRAM_FILES:
              if name.endswith('.py'):
                  py_compile.compile(str(source_file('.', name)), doraise=True)
          PY
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            test -n "$RELEASE_TAG"
            gh api --hostname github.com "repos/groopcd/oc-box/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/oc-box-release.json"
            python tools/check_release.py --publish --tag "$RELEASE_TAG" \
              --release-json "$RUNNER_TEMP/oc-box-release.json" \
              > "$RUNNER_TEMP/oc-box-validated-identity.json"
          else
            python tools/check_release.py > "$RUNNER_TEMP/oc-box-validated-identity.json"
          fi
      - name: Run source regression tests
        run: '"$RUNNER_TEMP/oc-box-build/bin/python" -B -m unittest discover -s tests -v'
      - name: Build wheel and source distribution
        run: |
          "$RUNNER_TEMP/oc-box-build/bin/python" -m build --no-isolation
          "$RUNNER_TEMP/oc-box-build/bin/python" -m twine check dist/*
      - name: Verify isolated package installation and resources
        run: python tools/check_package.py dist --with-vault --with-tui
      - name: Revalidate clean source and bind exact release artifacts
        id: artifacts
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(dist --identity "$RUNNER_TEMP/oc-box-validated-identity.json")
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            gh api --hostname github.com "repos/groopcd/oc-box/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/oc-box-release-final.json"
            args+=(--release-json "$RUNNER_TEMP/oc-box-release-final.json")
          fi
          python tools/check_release_artifacts.py "${args[@]}"
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            echo 'publish_validated=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/oc_box-*.whl
            dist/oc_box-*.tar.gz
            dist/validated-identity.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      success() &&
      (github.event_name == 'release' || inputs.publish) &&
      needs.build.outputs.publish_validated == 'true'
    needs: [candidate, source, distros, codeql, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/oc-box/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-artifacts
      - name: Verify transferred identity and checksums; select only distributions
        env:
          VERIFIED_CANDIDATE: ${{ needs.candidate.outputs.commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          bundle = Path("release-artifacts")
          identity = json.loads((bundle / "validated-identity.json").read_text())
          version = identity["distribution_version"]
          assert isinstance(version, str) and re.fullmatch(r"\d+\.\d+\.\d+(?:\.dev0)?", version)
          assert identity["publish_validated"] is True and identity["dirty"] is False
          assert identity["commit"] == os.environ["VERIFIED_CANDIDATE"]
          packages = {f"oc_box-{version}-py3-none-any.whl", f"oc_box-{version}.tar.gz"}
          expected = packages | {"validated-identity.json"}
          lines = (bundle / "SHA256SUMS").read_text().splitlines()
          assert len(lines) == len(expected)
          observed = set()
          for line in lines:
              digest, name = line.split("  ")
              assert name in expected and name not in observed
              assert re.fullmatch(r"[0-9a-f]{64}", digest)
              assert hashlib.sha256((bundle / name).read_bytes()).hexdigest() == digest
              observed.add(name)
          assert observed == expected
          assert {path.name for path in bundle.iterdir()} == expected | {"SHA256SUMS"}
          destination = Path("dist")
          destination.mkdir()
          for name in sorted(packages):
              shutil.copyfile(bundle / name, destination / name)
          PY
      - name: Recheck the live public tag before uploading
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERIFIED_CANDIDATE: ${{ needs.candidate.outputs.commit }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.dev0)?$ ]]
          [[ "$VERIFIED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          ref="refs/tags/$RELEASE_TAG"
          observed=$(timeout 30 git -c credential.helper= ls-remote --exit-code \
            https://github.com/groopcd/oc-box.git "$ref" "$ref^{}")
          peeled=$(awk -F '\t' -v ref="$ref" '
            $2 == ref { tip=$1; count++ }
            $2 == ref "^{}" { commit=$1; peeled_count++ }
            END {
              if (count != 1 || peeled_count > 1 || NR != count + peeled_count) exit 1
              print (peeled_count == 1 ? commit : tip)
            }
          ' <<< "$observed")
          test "$peeled" = "$VERIFIED_CANDIDATE"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  linkedin:
    needs: [build, publish]
    if: >-
      !inputs.skip_linkedin &&
      !contains(github.event.release.body || '', '<!-- linkedin:skip -->') &&
      (endsWith(github.event.release.tag_name || inputs.release_tag, '.dev0') ||
       vars.LINKEDIN_ANNOUNCEMENTS == 'true') &&
      needs.publish.result == 'success' &&
      needs.build.outputs.publish_validated == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/linkedin.yml
    with:
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      # Both release events and manual PyPI publication MUST only preview devel.
      action: ${{ endsWith(github.event.release.tag_name || inputs.release_tag, '.dev0') && 'preview' || 'announce' }}
    secrets:
      BUFFER_API_KEY: ${{ !endsWith(github.event.release.tag_name || inputs.release_tag, '.dev0') && secrets.BUFFER_API_KEY || '' }}
