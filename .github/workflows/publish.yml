name: Build and publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing GitHub release to PyPI after checks (false builds only)
        type: boolean
        default: false
      release_tag:
        description: Existing published release tag (required when publishing)
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish_validated: ${{ steps.release.outputs.publish_validated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Create isolated build tools
        run: |
          apt_root=$(mktemp -d /tmp/oc-box-ci-apt.XXXXXXXX)
          chmod 755 "$apt_root"
          apt_config=$(python3 tools/ci_ubuntu_apt.py --output "$apt_root/config")
          sudo apt-get -c "$apt_config" update
          sudo apt-get -c "$apt_config" install -y --no-install-recommends age
          python -m venv "$RUNNER_TEMP/oc-box-build"
          "$RUNNER_TEMP/oc-box-build/bin/python" -m pip install build twine 'cryptography>=44'
      - name: Validate source and release version
        id: release
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/build_docs.py --check
          python - <<'PY'
          import py_compile
          from oc_box.installation import PROGRAM_FILES, source_file
          for name in PROGRAM_FILES:
              if name.endswith('.py'):
                  py_compile.compile(str(source_file('.', name)), doraise=True)
          PY
          python tools/check_release.py
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            test -n "$RELEASE_TAG"
            gh api --hostname github.com "repos/groopcd/oc-box/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/oc-box-release.json"
            python tools/check_release.py --publish --tag "$RELEASE_TAG" \
              --release-json "$RUNNER_TEMP/oc-box-release.json"
            echo 'publish_validated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run source regression tests
        run: '"$RUNNER_TEMP/oc-box-build/bin/python" -B -m unittest discover -s tests -v'
      - name: Build wheel and source distribution
        run: |
          "$RUNNER_TEMP/oc-box-build/bin/python" -m build
          "$RUNNER_TEMP/oc-box-build/bin/python" -m twine check dist/*
      - name: Verify isolated package installation and resources
        run: python tools/check_package.py dist --with-vault
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (github.event_name == 'release' || inputs.publish) && needs.build.outputs.publish_validated == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/oc-box/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
