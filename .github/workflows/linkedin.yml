name: LinkedIn release announcement

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      BUFFER_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      action:
        description: Channels/preview never post; announce verifies public PyPI first
        type: choice
        options: [channels, preview, announce, reconcile]
        default: channels
      release_tag:
        description: Published immutable release tag (not needed for channels)
        type: string
        default: ''
      post_id:
        description: Existing Buffer post ID for read-only reconciliation only
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linkedin-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'groopcd/oc-box' &&
      (inputs.action == 'channels' || inputs.action == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate read-only inputs
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, re
          action, tag = os.environ["ACTION"], os.environ["RELEASE_TAG"]
          assert action in {"channels", "preview"}
          assert (not tag) if action == "channels" else re.fullmatch(r"v\d+\.\d+\.\d+(?:\.dev0)?", tag)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install isolated card renderer
        if: inputs.action == 'preview'
        run: |
          python -m venv "$RUNNER_TEMP/linkedin-tools"
          "$RUNNER_TEMP/linkedin-tools/bin/python" -m pip install 'Pillow>=13,<14'
      - name: Discover profiles without posting
        if: inputs.action == 'channels'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -B tools/announce_release.py channels
      - name: Generate preview without posting
        if: inputs.action == 'preview'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANNOUNCEMENT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/linkedin-tools/bin/python" -B tools/announce_release.py preview
          --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/linkedin-preview"
      - name: Save preview for review
        if: inputs.action == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linkedin-preview
          path: ${{ runner.temp }}/linkedin-preview/
          if-no-files-found: error
          retention-days: 7

  announcement:
    if: >-
      github.repository == 'groopcd/oc-box' &&
      vars.LINKEDIN_ANNOUNCEMENTS == 'true' &&
      (!inputs.action || inputs.action == 'announce' || inputs.action == 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Add card + immutable claim/receipt assets; never change tags.
    steps:
      - name: Validate tag before selecting source
        env:
          ACTION: ${{ inputs.action || 'announce' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, re
          action, tag = os.environ["ACTION"], os.environ["RELEASE_TAG"]
          assert action in {"announce", "reconcile"}
          assert re.fullmatch(r"v\d+\.\d+\.\d+(?:\.dev0)?", tag)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install isolated card renderer
        run: |
          python -m venv "$RUNNER_TEMP/linkedin-tools"
          "$RUNNER_TEMP/linkedin-tools/bin/python" -m pip install 'Pillow>=13,<14'
      - name: Announce or reconcile the existing post
        env:
          ACTION: ${{ inputs.action || 'announce' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          POST_ID: ${{ inputs.post_id }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.BUFFER_LINKEDIN_CHANNEL_ID }}
          LINKEDIN_ANNOUNCEMENTS: ${{ vars.LINKEDIN_ANNOUNCEMENTS }}
          ANNOUNCEMENT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=("$ACTION")
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          if [[ -n "$POST_ID" ]]; then args+=(--post-id "$POST_ID"); fi
          "$RUNNER_TEMP/linkedin-tools/bin/python" -B tools/announce_release.py "${args[@]}"
