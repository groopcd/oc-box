<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="ocbox-account-origin" content="__ACCOUNT_ORIGIN__">
  <meta name="ocbox-workspace-origin" content="__WORKSPACE_ORIGIN__">
  <meta name="ocbox-wasm-sha256" content="__WASM_SHA256__">
  <meta name="ocbox-wasm-size" content="__WASM_SIZE__">
  <title>oc-box · Web sign-in</title>
  <link rel="stylesheet" href="/account-assets/sign-in.css">
  <script type="module" src="/account-assets/sign-in.mjs"></script>
</head>
<body data-login>
  <header class="top">
    <div class="brand"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10m-4.5-17.5 9 5"/></svg>oc-box</div>
    <div class="project"><span class="eyebrow">Workspace</span> __WORKSPACE_LABEL__</div>
    <div class="top-end"><span class="tag connection"><span class="dot"></span> Private workspace</span></div>
  </header>
  <main class="login-stage" id="login-stage" aria-labelledby="login-title">
    <section class="login-card">
      <span class="icon-box"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10m-4.5-17.5 9 5"/></svg></span>
      <p class="eyebrow">oc-box / Web sign-in</p>
      <h1 id="login-title">Sign in to __WORKSPACE_LABEL__</h1>
      <p class="muted" id="login-description">Use the dedicated web password for this workspace.</p>
      <p class="muted" id="login-reach"><small id="login-reach-label">Local HTTPS only</small></p>
      <form id="login-form" class="login-form" autocomplete="off" data-state="loading">
        <label class="manager-field">Web username
          <input type="text" id="login-user" required disabled autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32" aria-describedby="login-help login-error">
        </label>
        <div class="manager-field">
          <label for="login-password">Web password</label>
          <div class="login-secret">
            <input type="password" id="login-password" required disabled autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="1024" aria-describedby="login-help login-error">
            <button type="button" class="action" id="login-show" disabled aria-controls="login-password" aria-pressed="false">Show</button>
          </div>
        </div>
        <p class="login-error" id="login-error" role="status">Preparing local sign-in…</p>
        <button type="button" class="send" id="login-submit" disabled>Sign in</button>
        <button type="button" class="send" id="login-continue" disabled hidden>Continue to workspace</button>
      </form>
      <div class="login-footer">
        <p class="muted" id="login-help">Use your web account password. Never enter your vault passphrase here.</p>
      </div>
    </section>
  </main>
</body>
</html>
